   VSTUP

<script>

/* =========================
   FOXAI ZÁKLAD
   ========================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");


const FoxAI = {

    version:
        "5.1",

    name:
        "FoxAI",

    project:
        "TondaFox AI Project 1",

    messages:
        [],

    model:
        null,

    modelReady:
        false

};


/* =========================
   VSTUP
   ========================= */

input.addEventListener(
    "input",
    () => {

        send.disabled =
            !input.value.trim();

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) + "px";

    }
);


/* =========================
   ENTER
   ========================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            send.click();

        }

    }
);


/* =========================
   TÉMA
   ========================= */

document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        () => {

            document.body.classList.toggle(
                "dark"
            );

        }
    );


/* =========================
   NOVÝ CHAT
   ========================= */

document
    .getElementById("newChat")
    .addEventListener(
        "click",
        () => {

            FoxAI.messages = [];

            chatInner
                .querySelectorAll(".message")
                .forEach(
                    message =>
                        message.remove()
                );

            welcome.style.display =
                "";

        }
    );


console.log(
    "🦊 FoxAI V5.1 — 1/4"
);

</script>


<script type="module">

/* =========================================================
   FOXAI V5.1
   ČÁST 2/4 — SKUTEČNÝ AI ENGINE
   ========================================================= */

import {
    pipeline,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";


/* =========================================================
   POVOLENÍ LOCAL MODELŮ
   ========================================================= */

env.allowRemoteModels = true;

env.allowLocalModels = false;


/* =========================================================
   NASTAVENÍ FOXAI
   ========================================================= */

FoxAI.modelName =
    "HuggingFaceTB/SmolLM2-135M-Instruct";

FoxAI.generator =
    null;

FoxAI.loading =
    false;

FoxAI.generating =
    false;


/* =========================================================
   VYTVOŘENÍ ZPRÁVY
   ========================================================= */

function addMessage(
    role,
    text
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "👤"
            : "🦊";


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    const author =
        document.createElement(
            "div"
        );

    author.className =
        "author";

    author.textContent =
        role === "user"
            ? "Ty"
            : "FoxAI";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    content.appendChild(
        author
    );

    content.appendChild(
        bubble
    );


    message.appendChild(
        avatar
    );

    message.appendChild(
        content
    );


    chatInner.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    return bubble;

}


/* =========================================================
   NAČTENÍ SKUTEČNÉHO MODELU
   ========================================================= */

async function loadFoxModel() {

    if (
        FoxAI.generator
    ) {

        return true;

    }


    if (
        FoxAI.loading
    ) {

        return false;

    }


    FoxAI.loading =
        true;


    const loadingBubble =
        addMessage(
            "assistant",
            "🦊 Načítám AI model…"
        );


    try {

        /*
         * Nejdříve zkusíme WebGPU.
         */

        try {

            FoxAI.generator =
                await pipeline(
                    "text-generation",
                    FoxAI.modelName,
                    {
                        device:
                            "webgpu"
                    }
                );

        }

        catch (
            webgpuError
        ) {

            console.log(
                "WebGPU není dostupné, používám WASM.",
                webgpuError
            );


            /*
             * Záložní varianta:
             * WebAssembly.
             */

            FoxAI.generator =
                await pipeline(
                    "text-generation",
                    FoxAI.modelName
                );

        }


        FoxAI.modelReady =
            true;

        FoxAI.loading =
            false;


        /*
         * Stavová zpráva není součástí
         * historie AI.
         */

        loadingBubble.textContent =
            "🦊 Model je připravený.";


        setTimeout(
            () => {

                const element =
                    loadingBubble.closest(
                        ".message"
                    );


                if (
                    element
                ) {

                    element.remove();

                }

            },
            1000
        );


        console.log(
            "FoxAI Local Model ready."
        );


        return true;

    }

    catch (
        error
    ) {

        FoxAI.loading =
            false;


        console.error(
            "FoxAI model error:",
            error
        );


        loadingBubble.textContent =
            "❌ Nepodařilo se načíst AI model.";

        return false;

    }

}


/* =========================================================
   VYTVOŘENÍ PROMPTU
   ========================================================= */

function createFoxPrompt(
    userText
) {

    let prompt =

`You are FoxAI.

You are a general AI assistant created by TondaFox.

Answer naturally and helpfully.

If the user writes Czech, answer in Czech.

You can help with programming, HTML, CSS, JavaScript and Python.

When asked for code, provide real working code.

Do not repeat the words User or FoxAI as conversation labels.

Do not create another conversation inside your answer.

`;


    /*
     * Použijeme pouze skutečné zprávy
     * z této konverzace.
     */

    const history =
        FoxAI.messages.slice(-6);


    for (
        const message
        of history
    ) {

        if (
            message.role === "user"
        ) {

            prompt +=
                "\nUser: " +
                message.text;

        }


        if (
            message.role === "assistant"
        ) {

            prompt +=
                "\nAssistant: " +
                message.text;

        }

    }


    prompt +=
        "\nUser: " +
        userText;


    prompt +=
        "\nAssistant:";


    return prompt;

}


/* =========================================================
   OČIŠTĚNÍ ODPOVĚDI
   ========================================================= */

function cleanFoxResponse(
    text
) {

    let answer =
        String(
            text || ""
        ).trim();


    /*
     * Odstraníme případný prompt.
     */

    answer =
        answer.replace(
            /^Assistant:\s*/i,
            ""
        );


    answer =
        answer.replace(
            /^FoxAI:\s*/i,
            ""
        );


    /*
     * Zabráníme tomu,
     * aby model pokračoval jako
     * další uživatel.
     */

    const userPosition =
        answer.search(
            /\nUser\s*:/i
        );


    if (
        userPosition !== -1
    ) {

        answer =
            answer.substring(
                0,
                userPosition
            ).trim();

    }


    return answer;

}


/* =========================================================
   GENEROVÁNÍ ODPOVĚDI
   ========================================================= */

async function generateFoxAnswer(
    userText,
    bubble
) {

    if (
        !FoxAI.generator
    ) {

        return;

    }


    const prompt =
        createFoxPrompt(
            userText
        );


    try {

        const result =
            await FoxAI.generator(
                prompt,
                {

                    max_new_tokens:
                        256,

                    temperature:
                        0.7,

                    top_p:
                        0.9,

                    do_sample:
                        true,

                    repetition_penalty:
                        1.12

                }
            );


        let generated =
            "";


        if (
            result &&
            result[0]
        ) {

            generated =
                result[0]
                    .generated_text ||
                "";

        }


        /*
         * Model někdy vrátí celý prompt.
         */

        if (
            generated.startsWith(
                prompt
            )
        ) {

            generated =
                generated.substring(
                    prompt.length
                );

        }


        generated =
            cleanFoxResponse(
                generated
            );


        if (
            !generated
        ) {

            generated =
                "Zkus mi otázku napsat ještě jednou.";

        }


        bubble.textContent =
            generated;


        /*
         * Uložíme pouze skutečnou
         * odpověď modelu.
         */

        FoxAI.messages.push({

            role:
                "assistant",

            text:
                generated

        });


    }

    catch (
        error
    ) {

        console.error(
            "FoxAI generation error:",
            error
        );


        bubble.textContent =
            "❌ Při generování odpovědi nastala chyba.";

    }

}


/* =========================================================
   ODESLÁNÍ ZPRÁVY
   ========================================================= */

send.addEventListener(
    "click",
    async () => {

        if (
            FoxAI.generating
        ) {

            return;

        }


        const text =
            input.value.trim();


        if (
            !text
        ) {

            return;

        }


        FoxAI.generating =
            true;

        send.disabled =
            true;


        input.value =
            "";

        input.style.height =
            "auto";


        /*
         * Skryjeme úvod.
         */

        welcome.style.display =
            "none";


        /*
         * Uživatelská zpráva.
         */

        addMessage(
            "user",
            text
        );


        /*
         * Uživatel se uloží právě jednou.
         */

        FoxAI.messages.push({

            role:
                "user",

            text:
                text

        });


        /*
         * Načteme model.
         */

        if (
            !FoxAI.generator
        ) {

            const ready =
                await loadFoxModel();


            if (
                !ready
            ) {

                FoxAI.generating =
                    false;

                send.disabled =
                    false;

                return;

            }

        }


        /*
         * Vytvoříme prázdnou AI bublinu.
         */

        const bubble =
            addMessage(
                "assistant",
                "🦊 Přemýšlím…"
            );


        await generateFoxAnswer(
            text,
            bubble
        );


        FoxAI.generating =
            false;

        send.disabled =
            false;


        input.focus();

    }
);


/* =========================================================
   STAV
   ========================================================= */

console.log(
    "🦊 FoxAI V5.1 — část 2/4 načtena."
);

</script>

/* =========================================================
   FORMÁTOVÁNÍ KÓDU
   ========================================================= */

function escapeHTML(
    text
) {

    return String(
        text
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   VYKRESLENÍ ODPOVĚDI
   ========================================================= */

function renderFoxResponse(
    bubble,
    text
) {

    const codeRegex =
        /```([a-zA-Z0-9+#.-]*)\n?([\s\S]*?)```/g;


    let lastIndex =
        0;


    let html =
        "";


    let match;


    while (
        (
            match =
            codeRegex.exec(text)
        ) !== null
    ) {

        const before =
            text.substring(
                lastIndex,
                match.index
            );


        if (
            before.trim()
        ) {

            html +=
                formatNormalText(
                    before
                );

        }


        const language =
            match[1]
                .trim()
                .toLowerCase()
                ||
                "code";


        const code =
            match[2]
                .trim();


        const encoded =
            escapeHTML(
                code
            );


        html += `

            <div
                class="fox-code"
            >

                <div
                    class="fox-code-header"
                >

                    <span
                        class="fox-code-language"
                    >
                        ${escapeHTML(language)}
                    </span>


                    <button
                        class="fox-copy-button"
                        data-code="${encodeURIComponent(code)}"
                    >
                        📋 Kopírovat
                    </button>

                </div>


                <pre><code>${encoded}</code></pre>

            </div>

        `;


        lastIndex =
            match.index +
            match[0].length;

    }


    const remaining =
        text.substring(
            lastIndex
        );


    if (
        remaining.trim()
    ) {

        html +=
            formatNormalText(
                remaining
            );

    }


    if (
        !html
    ) {

        html =
            escapeHTML(
                text
            );

    }


    bubble.innerHTML =
        `<div class="fox-text">${html}</div>`;


    /*
     * Tlačítka Kopírovat.
     */

    bubble
        .querySelectorAll(
            ".fox-copy-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const code =
                            decodeURIComponent(
                                button.dataset.code
                            );


                        try {

                            await navigator
                                .clipboard
                                .writeText(
                                    code
                                );


                            button.textContent =
                                "✓ Zkopírováno";


                            setTimeout(
                                () => {

                                    button.textContent =
                                        "📋 Kopírovat";

                                },
                                1500
                            );

                        }

                        catch (
                            error
                        ) {

                            console.error(
                                error
                            );


                            button.textContent =
                                "❌ Nelze kopírovat";

                        }

                    }
                );

            }
        );

}


/* =========================================================
   NORMÁLNÍ TEXT
   ========================================================= */

function formatNormalText(
    text
) {

    let safe =
        escapeHTML(
            text
        );


    /*
     * Jednoduché zvýraznění.
     */

    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
     * Řádky převedeme na odstavce.
     */

    const paragraphs =
        safe
            .split(
                /\n\s*\n/
            )
            .map(
                paragraph =>
                    `<p>${paragraph.replace(/\n/g, "<br>")}</p>`
            )
            .join("");


    return paragraphs;

}


/* =========================================================
   PŘEPÍŠEME VYKRESLENÍ AI BUBLINY

     * Markdown kód na vizuální blok.

    const generatedText =

};

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

   SLEDOVÁNÍ NOVÝCH ZPRÁV
   ========================================================= */

    new MutationObserver(
        () => {

            scrollFoxChat();

        }
    );

    chatInner,
    {
        childList: true,
        subtree: true
    }
);

   ========================================================= */

function saveFoxChat() {

    try {

        localStorage.setItem(
            "foxai-chat",
            JSON.stringify(
                FoxAI.messages
            )
        );

    }

        error
    ) {

        console.warn(

            error

   NAČTENÍ KONVERZACE
   ========================================================= */

function loadFoxChat() {

    try {

        const saved =
            localStorage.getItem(
                "foxai-chat"
            );


        if (
            !saved
        ) {

            return;

        }


        const messages =
            JSON.parse(
                saved
            );


        if (
            !Array.isArray(
                messages
            )
        ) {

            return;

        }


        FoxAI.messages =
            messages;


        /*
         * Zobrazíme starší zprávy.
         */

        messages.forEach(
            message => {

                addMessage(
                    message.role,
                    message.text
                );

            }
        );


        if (
            messages.length > 0
        ) {

            welcome.style.display =
                "none";

        }

    }

    catch (
        error
    ) {

        console.warn(
            "FoxAI: uložený chat je neplatný.",
            error
        );

    }

}
