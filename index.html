<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxai - TondaFox ai project 1</title>
    <style>
        /* Moderní tmavý design se zářivou oranžovou barvou */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            background: #161b22;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
        }

        h1 {
            color: #ff7a00; /* Liščí oranžová */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Styl pro první tlačítko */
        .btn-primary {
            background-color: #ff7a00;
            color: #ffffff;
            border: 2px solid #ff7a00;
        }

        .btn-primary:hover {
            background-color: #e06b00;
            border-color: #e06b00;
            transform: translateY(-2px);
        }

        /* Styl pro druhé tlačítko */
        .btn-secondary {
            background-color: transparent;
            color: #ff7a00;
            border: 2px solid #ff7a00;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 122, 0, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Foxai</h1>
        <div class="subtitle">TondaFox ai project 1</div>
        
        <p>
            Vítejte v mém prvním projektu zaměřeném na umělou inteligenci a moderní technologie. 
            Tento web slouží jako rozcestník pro experimenty, nástroje a podstránky, 
            které v rámci projektu vyvíjím. Vyberte si jednu z níže uvedených sekcí.
        </p>

        <div class="button-group">
            <!-- Sem do uvozovek href="..." vložíte odkaz na 1. podstránku -->
            <a href="https://tondafox-site.github.io/foxai/v1.1" class="btn btn-primary">Verze 1.1</a>
            
            <!-- Sem do uvozovek href="..." vložíte odkaz na 2. podstránku -->
            <a href="https://tondafox-site.github.io/foxai/2.0" class="btn btn-secondary">Verze 2.0</a>
        </div>
    </div>

</body>
</html>
